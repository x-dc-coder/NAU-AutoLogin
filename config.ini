# ========================================================
# 南京审计大学校园网双网卡保活与无线优选策略配置 (Windows 版)
# 敏感认证信息（学号/密码）已移至 .env 环境变量文件中
# ========================================================

[adapter]
# 有线网卡名称（精准匹配 Windows 网络连接中的名称，如 "以太网 2"）
eth_name = 以太网 2

# 无线网卡名称（如 "WLAN"）
wlan_name = WLAN

# 校园网无线 Profile 名称（系统已保存连接配置，通常为 "i-NAU"）
wlan_profile = i-NAU

[failover]
# 轮询检测周期（秒）
check_interval = 30

# 有线恢复且健康稳定后，是否主动断开无线网络（true: 100% 流量优先走有线; false: 保留无线但靠 Metric 路由）
disconnect_wlan_when_wired_healthy = true

# 有线网络需要连续健康多少个检测周期后才执行断开无线（防网络闪断或链路震荡）
wired_stable_cycles = 2

# 是否允许强制抢占其他已连接的非 i-NAU WiFi（如手机热点）
# false: 若用户手动连接了手机热点且外网正常，尊重用户选择，不主动踢断
allow_override_other_ssid = false

[ap_optimization]
# 是否启用无线弱信号 AP 自动优选（打破 Windows AP 粘连，重连至最优 AP）
enable_ap_optimize = true

# 弱信号判定阈值（信号百分比，低于该值且存在更优 AP 时将考虑触发重选，默认 45%）
weak_signal_threshold = 45

# 网关高延迟判定阈值（毫秒，默认 150ms，高于该值可能表示当前 AP 拥塞）
high_rtt_threshold_ms = 150

# 连续多少个周期检测到信号弱或高延迟才确认链路劣化（去抖防瞬时扰动，默认 2 个周期 = 60s）
debounce_cycles = 2

# 备选 AP 相比当前 AP 必须高出的最小信号差百分比（滞回余量，防止频繁乒乓切换，默认 15%）
hysteresis_margin = 15

# AP 重选最小冷却期（秒，重选后至少等待此时间才允许下一次重选，默认 300 秒 = 5 分钟）
cooldown_seconds = 300

# 每日最大允许重选次数（防止整个网络恶化时无限循环重连，默认 15 次）
max_daily_reassociations = 15

[logging]
# 日志文件路径（留空则默认保存在 %USERPROFILE%\.nau-autologin\autologin.log）
log_path = 

# 单个日志文件最大大小（字节，默认 5MB）
log_max_bytes = 5242880

# 历史日志备份保留个数
log_backup_count = 3
